<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillSet — English for Tech &amp; Media Careers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12171F;
    --ink-soft:#1B2431;
    --paper:#EEEAE0;
    --paper-2:#F8F5EE;
    --line:#D9D2C1;
    --line-soft:#E4DFD1;
    --amber:#F2A93B;
    --teal:#1FADA6;
    --coral:#D63447;
    --green:#2FAE6D;
    --text-dark:#1B2330;
    --text-mute:#5B6270;
    --text-light:#F3F1EA;
    --radius:6px;
    --shadow:0 1px 0 rgba(18,23,31,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--text-dark);
    font-family:'Space Grotesk',sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;margin:0;font-weight:600;}
  p{margin:0;}
  button{font-family:inherit;cursor:pointer;}
  a{color:inherit;}
  ::selection{background:var(--amber);color:var(--ink);}

  /* ---------- Top bar ---------- */
  .topbar{
    background:var(--ink);
    color:var(--text-light);
    padding:16px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;top:0;z-index:40;
    border-bottom:1px solid #0A0D12;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:30px;height:30px;border-radius:7px;
    background:linear-gradient(135deg,var(--amber),var(--teal));
    display:flex;align-items:center;justify-content:center;
    font-weight:700;color:var(--ink);font-size:15px;
  }
  .brand-name{font-weight:700;font-size:18px;letter-spacing:0.2px;}
  .brand-tag{font-size:12.5px;color:#9AA3B2;display:none;}
  @media(min-width:640px){.brand-tag{display:block;border-left:1px solid #333c4a;padding-left:10px;margin-left:2px;}}
  .home-link{font-size:14px;color:#C9CFDA;text-decoration:none;border:1px solid #333c4a;padding:7px 14px;border-radius:5px;transition:border-color .15s,color .15s;background:none;}
  .home-link:hover{border-color:var(--amber);color:var(--text-light);}

  /* ---------- Layout ---------- */
  #app{max-width:1180px;margin:0 auto;padding:0 20px 80px;}

  /* ---------- Hero / Home ---------- */
  .hero{padding:56px 4px 30px;max-width:720px;}
  .hero-eyebrow{color:var(--text-mute);font-size:14px;margin-bottom:10px;}
  .hero h1{font-size:clamp(32px,5vw,46px);line-height:1.08;color:var(--ink);}
  .hero h1 em{font-style:normal;color:var(--teal);}
  .hero p.lead{margin-top:16px;font-size:17px;color:#40485A;max-width:60ch;}

  .board-label{
    display:flex;align-items:baseline;justify-content:space-between;
    margin:44px 0 18px;padding-bottom:10px;border-bottom:1px solid var(--line);
  }
  .board-label h2{font-size:20px;color:var(--ink);}
  .board-label span{font-size:13.5px;color:var(--text-mute);}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:14px;
  }
  .card{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-left:5px solid var(--accent,var(--teal));
    border-radius:4px;
    padding:18px 18px 20px;
    text-align:left;
    display:flex;flex-direction:column;gap:10px;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    opacity:0;
    animation:cardIn .5s ease forwards;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 24px -14px rgba(18,23,31,0.35);}
  @keyframes cardIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .card-icon{
    width:38px;height:38px;border-radius:50%;
    background:var(--accent,var(--teal));
    display:flex;align-items:center;justify-content:center;
    font-size:18px;color:#fff;
  }
  .card h3{font-size:16.5px;color:var(--ink);}
  .card p{font-size:13.5px;color:var(--text-mute);flex:1;}
  .card .go{font-size:13px;font-weight:600;color:var(--accent,var(--teal));}

  .footer{
    margin-top:70px;padding-top:22px;border-top:1px solid var(--line);
    display:flex;justify-content:center;align-items:center;
    color:var(--text-mute);font-size:13.5px;
  }
  .footer-credit{font-size:15.5px;font-weight:600;color:var(--ink);}

  /* ---------- Profession page ---------- */
  .prof-header{
    padding:34px 0 4px;display:flex;align-items:flex-start;gap:16px;
  }
  .prof-icon{
    width:52px;height:52px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;
    background:var(--accent);
  }
  .prof-header h1{font-size:clamp(24px,4vw,32px);color:var(--ink);}
  .prof-header .sub{color:var(--text-mute);font-size:14.5px;margin-top:4px;}
  .back-btn{
    background:none;border:1px solid var(--line);color:var(--text-mute);
    padding:6px 12px;border-radius:5px;font-size:13px;margin-bottom:18px;
    display:inline-flex;align-items:center;gap:6px;
  }
  .back-btn:hover{border-color:var(--ink);color:var(--ink);}

  .reading-wrap{
    display:grid;grid-template-columns:1.6fr 1fr;gap:24px;margin-top:22px;
  }
  @media(max-width:820px){.reading-wrap{grid-template-columns:1fr;}}
  .reading-card{
    background:var(--paper-2);border:1px solid var(--line);border-radius:6px;
    padding:28px 30px;
  }
  .reading-card h2{font-size:19px;color:var(--ink);font-family:'Space Grotesk',sans-serif;}
  .reading-head{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    margin-bottom:16px;flex-wrap:wrap;
  }
  .audio-btn{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--paper);border:1.5px solid var(--accent,var(--teal));color:var(--accent,var(--teal));
    padding:8px 16px;border-radius:20px;font-size:13.5px;font-weight:600;
    transition:background .15s,color .15s;
  }
  .audio-btn:hover{background:var(--accent,var(--teal));color:#fff;}
  .audio-btn.playing{background:var(--accent,var(--teal));color:#fff;}
  .audio-btn .icon{font-size:15px;}
  .reading-card p{
    font-family:'Source Serif 4',serif;font-size:17px;line-height:1.72;
    color:#232B38;margin-bottom:16px;max-width:66ch;
  }
  .reading-card p:last-child{margin-bottom:0;}
  .term-btn{
    font:inherit;background:none;border:none;padding:0;margin:0;cursor:pointer;
    color:var(--accent);font-weight:600;border-bottom:2px dashed var(--accent);
    transition:background .12s,color .12s;
  }
  .term-btn:hover,.term-btn.active{background:var(--accent);color:#fff;border-bottom-style:solid;border-radius:2px;}

  .term-tip{
    position:fixed;z-index:80;max-width:280px;background:var(--ink);color:var(--text-light);
    padding:12px 14px;border-radius:7px;font-family:'Space Grotesk',sans-serif;font-size:13.5px;
    line-height:1.45;box-shadow:0 12px 28px -10px rgba(0,0,0,0.45);
    opacity:0;transform:translateY(4px);pointer-events:none;transition:opacity .12s,transform .12s;
  }
  .term-tip.show{opacity:1;transform:translateY(0);pointer-events:auto;}
  .term-tip b{display:block;color:var(--amber);font-size:13.5px;margin-bottom:3px;text-transform:capitalize;}

  .glossary{
    background:var(--ink);color:var(--text-light);border-radius:6px;
    padding:22px 22px;align-self:start;position:sticky;top:78px;
  }
  .glossary h2{font-size:15px;color:#9AA3B2;text-transform:none;margin-bottom:14px;font-weight:600;}
  .glossary dl{margin:0;display:flex;flex-direction:column;gap:12px;}
  .glossary dt{font-weight:700;color:var(--accent);font-size:14.5px;}
  .glossary dd{margin:2px 0 0;font-size:13.5px;color:#C9CFDA;line-height:1.5;}

  /* ---------- Step tracker ---------- */
  .steps{
    display:flex;gap:8px;margin-top:38px;flex-wrap:wrap;
  }
  .step-btn{
    flex:1;min-width:140px;
    background:var(--paper-2);border:1px solid var(--line);border-radius:6px;
    padding:12px 14px;text-align:left;font-size:13.5px;color:var(--text-mute);
    display:flex;flex-direction:column;gap:4px;position:relative;
  }
  .step-btn .num{
    width:22px;height:22px;border-radius:50%;background:var(--line);color:#fff;
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;
  }
  .step-btn.active{border-color:var(--accent);background:var(--paper);}
  .step-btn.active .num{background:var(--accent);}
  .step-btn.done .num{background:var(--green);}
  .step-btn .label{font-weight:600;color:var(--ink);font-size:13.5px;}
  .step-btn .score-tag{font-size:12px;color:var(--green);font-weight:700;}

  .activity-panel{
    margin-top:20px;background:var(--paper-2);border:1px solid var(--line);border-radius:6px;
    padding:28px 30px;
  }
  .activity-panel h3{font-size:19px;color:var(--ink);margin-bottom:6px;}
  .activity-panel .instructions{color:var(--text-mute);font-size:14px;margin-bottom:22px;}

  .btn{
    background:var(--ink);color:var(--text-light);border:none;padding:10px 20px;
    border-radius:5px;font-size:14px;font-weight:600;
  }
  .btn:hover{background:var(--ink-soft);}
  .btn.secondary{background:none;border:1px solid var(--line);color:var(--text-mute);}
  .btn.secondary:hover{border-color:var(--ink);color:var(--ink);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-row{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;align-items:center;}

  .feedback{
    margin-top:16px;padding:14px 16px;border-radius:6px;font-size:14.5px;font-weight:600;
    display:none;
  }
  .feedback.show{display:block;}
  .feedback.good{background:#E4F5EC;color:#1E7A4C;}
  .feedback.mid{background:#FCF0DA;color:#96660B;}
  .feedback.low{background:#FBE7E7;color:#A72C36;}

  /* Matching */
  .match-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;}
  @media(max-width:600px){.match-grid{grid-template-columns:1fr;}}
  .match-col h4{font-size:12.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-mute);margin-bottom:10px;}
  .match-item{
    display:block;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);
    border-radius:5px;padding:12px 14px;margin-bottom:8px;font-size:14.5px;color:var(--text-dark);
    transition:border-color .12s, background .12s;
  }
  .match-item:hover{border-color:var(--accent);}
  .match-item.selected{border-color:var(--accent);background:#fff;box-shadow:0 0 0 2px var(--accent) inset;}
  .match-item.solved{border-color:var(--green);background:#E4F5EC;color:#1E7A4C;cursor:default;font-weight:600;}
  .match-item.wrong{border-color:var(--coral);background:#FBE7E7;}
  .match-item.disabled{pointer-events:none;}

  /* Dropdown */
  .cloze-line{font-family:'Source Serif 4',serif;font-size:16.5px;line-height:2.4;color:#232B38;margin-bottom:6px;}
  select.blank-select{
    font-family:'Space Grotesk',sans-serif;font-size:14.5px;padding:5px 8px;border-radius:5px;
    border:1.5px solid var(--line);background:#fff;color:var(--text-dark);margin:0 3px;
  }
  select.blank-select.correct{border-color:var(--green);background:#E4F5EC;}
  select.blank-select.incorrect{border-color:var(--coral);background:#FBE7E7;}

  /* Fill word bank */
  .word-bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;padding:14px;background:var(--paper);border:1px dashed var(--line);border-radius:6px;}
  .bank-chip{
    background:var(--ink);color:var(--text-light);border:none;border-radius:20px;
    padding:8px 16px;font-size:13.5px;font-weight:600;
  }
  .bank-chip:disabled{background:var(--line);color:var(--text-mute);opacity:0.6;}
  .blank-line{font-family:'Source Serif 4',serif;font-size:16.5px;line-height:2.3;color:#232B38;margin-bottom:10px;}
  .blank-slot{
    display:inline-flex;align-items:center;justify-content:center;min-width:110px;
    border-bottom:2px solid var(--accent);background:none;font-family:'Space Grotesk',sans-serif;
    font-weight:600;font-size:14px;color:var(--ink);padding:2px 8px;margin:0 2px;
  }
  .blank-slot.empty{color:#A9AFBC;}
  .blank-slot.correct{color:#1E7A4C;border-color:var(--green);}
  .blank-slot.incorrect{color:#A72C36;border-color:var(--coral);}

  /* Anagram */
  .anagram-word{margin-bottom:28px;padding-bottom:24px;border-bottom:1px solid var(--line-soft);}
  .anagram-word:last-child{border-bottom:none;}
  .anagram-clue{font-size:14px;color:var(--text-mute);margin-bottom:12px;font-style:italic;}
  .tile-row,.slot-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px;}
  .tile{
    width:36px;height:36px;border-radius:5px;background:var(--ink);color:var(--text-light);
    border:none;font-weight:700;font-size:15px;text-transform:uppercase;
  }
  .tile:disabled{background:var(--line);color:transparent;}
  .slot{
    width:36px;height:36px;border-radius:5px;border:2px solid var(--line);background:var(--paper);
    font-weight:700;font-size:15px;text-transform:uppercase;color:var(--ink);
  }
  .slot.filled{border-color:var(--accent);background:#fff;}
  .slot.correct{border-color:var(--green);background:#E4F5EC;color:#1E7A4C;}
  .slot.incorrect{border-color:var(--coral);background:#FBE7E7;color:#A72C36;}

  /* Connections */
  .conn-instructions{font-size:14px;color:var(--text-mute);margin-bottom:16px;}
  .conn-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:640px;}
  @media(max-width:560px){.conn-grid{grid-template-columns:repeat(2,1fr);}}
  .conn-tile{
    aspect-ratio:2.1/1;background:var(--paper);border:1.5px solid var(--line);border-radius:6px;
    font-size:12.5px;font-weight:700;color:var(--text-dark);display:flex;align-items:center;justify-content:center;
    text-align:center;padding:6px;text-transform:uppercase;letter-spacing:0.02em;
  }
  .conn-tile:hover{border-color:var(--ink);}
  .conn-tile.selected{border-color:var(--ink);background:#fff;box-shadow:0 0 0 2px var(--ink) inset;}
  .conn-tile.solved{cursor:default;color:#fff;border-color:transparent;}
  .conn-tile.shake{animation:shake .3s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
  .conn-groups-solved{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
  .conn-solved-row{
    padding:10px 14px;border-radius:6px;color:#fff;font-size:13px;
  }
  .conn-solved-row b{display:block;font-size:13.5px;margin-bottom:2px;text-transform:uppercase;letter-spacing:0.03em;}
  .conn-meta{font-size:13.5px;color:var(--text-mute);margin-top:14px;}

  /* Results */
  .results-banner{
    margin-top:36px;padding:26px 28px;border-radius:8px;background:var(--ink);color:var(--text-light);
  }
  .results-banner h3{font-size:20px;margin-bottom:6px;}
  .results-banner .big-score{font-size:42px;font-weight:700;color:var(--amber);margin:6px 0;}
  .results-table{width:100%;border-collapse:collapse;margin-top:16px;font-size:13.5px;}
  .results-table td{padding:7px 0;border-bottom:1px solid #2a3342;color:#C9CFDA;}
  .results-table td:last-child{text-align:right;font-weight:700;color:var(--text-light);}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="brand-mark">S</div>
    <div class="brand-name">SkillSet</div>
    <div class="brand-tag">English for tech &amp; media careers</div>
  </div>
  <button class="home-link" onclick="goHome()">All professions</button>
</div>
<div id="app"></div>
<div id="term-tip" class="term-tip" role="tooltip"></div>

<script>
/* =========================================================
   DATA
   ========================================================= */
const PROFESSIONS = [

{
  id:"devops", name:"DevOps Engineer", icon:"⚙️", color:"#3E6FF2",
  intro:"Automating software so it ships fast, safely and without drama.",
  reading:[
    "A DevOps Engineer works at the meeting point between software development and IT operations. Instead of keeping these two teams apart, a DevOps Engineer builds a **pipeline** that connects them, allowing new code to move smoothly from a developer's laptop to a live product that customers can use.",
    "**Automation** is at the heart of this profession: rather than performing repetitive tasks by hand, DevOps Engineers write scripts that test, build and release software automatically. When a new version of an application is ready, the engineer manages its **deployment**, making sure it reaches users without downtime or errors.",
    "Behind every website or app there is an **infrastructure** of servers, networks and storage, and DevOps Engineers are responsible for keeping this infrastructure stable and secure. Through constant **monitoring**, they can spot unusual behaviour, such as a sudden spike in traffic, before it becomes a serious problem.",
    "When something does go wrong, they must **troubleshoot** the issue quickly, tracing it back to its root cause. Because systems must handle both quiet periods and heavy demand, engineers design for **scalability**, so a service can grow without breaking. None of this happens alone: DevOps is fundamentally about **collaboration**, bringing developers, testers and operations staff together to release better software, faster."
  ],
  glossary:[
    {t:"pipeline",d:"the automated steps that move code from writing to release"},
    {t:"automation",d:"using technology to perform tasks without human effort each time"},
    {t:"deployment",d:"the process of releasing a new version of software to users"},
    {t:"infrastructure",d:"the servers, networks and storage that a system runs on"},
    {t:"monitoring",d:"watching systems continuously to detect problems early"},
    {t:"troubleshoot",d:"to find and fix the cause of a problem"},
    {t:"scalability",d:"the ability of a system to grow and handle more demand"},
    {t:"collaboration",d:"people working together towards a shared goal"}
  ],
  matching:[
    {t:"automation",d:"using technology to perform tasks without human effort each time"},
    {t:"pipeline",d:"the automated steps that move code from writing to release"},
    {t:"deployment",d:"the process of releasing a new version of software to users"},
    {t:"monitoring",d:"watching systems continuously to detect problems early"},
    {t:"troubleshoot",d:"to find and fix the cause of a problem"},
    {t:"scalability",d:"the ability of a system to grow and handle more demand"}
  ],
  dropdown:[
    {s:"If traffic suddenly increases, a well-designed system should still work thanks to its ___.",o:["scalability","typography","budget"],a:"scalability"},
    {s:"The team wrote scripts to handle ___, so tasks no longer needed to be done by hand.",o:["automation","branding","cabling"],a:"automation"},
    {s:"New code moves through the ___ before it reaches real users.",o:["pipeline","palette","ticket"],a:"pipeline"},
    {s:"After release, engineers rely on ___ to catch problems early.",o:["monitoring","storytelling","composition"],a:"monitoring"},
    {s:"When the server crashed, the engineer had to ___ the issue immediately.",o:["troubleshoot","publish","escalate"],a:"troubleshoot"}
  ],
  fillword:{
    bank:["deployment","collaboration","infrastructure","monitoring","scalability","budget"],
    blanks:[
      {s:"The new version's ___ went smoothly, with zero downtime for customers.",a:"deployment"},
      {s:"Nothing in DevOps works without close ___ between developers and operations staff.",a:"collaboration"},
      {s:"The company's entire ___, including servers and networks, runs in the cloud.",a:"infrastructure"},
      {s:"Continuous ___ helps the team notice problems before customers do.",a:"monitoring"},
      {s:"Good ___ means the app keeps working even during a huge traffic spike.",a:"scalability"}
    ]
  },
  anagram:[
    {word:"pipeline",clue:"the automated steps that move code from writing to release"},
    {word:"deployment",clue:"releasing a new version of software to users"},
    {word:"monitoring",clue:"watching systems continuously to detect problems early"},
    {word:"scalability",clue:"the ability of a system to grow and handle more demand"}
  ],
  connections:{groups:[
    {name:"CI/CD steps",words:["build","test","release","deploy"]},
    {name:"Cloud & infrastructure",words:["server","container","cluster","cloud"]},
    {name:"Monitoring words",words:["alert","log","dashboard","metric"]},
    {name:"Team words",words:["collaborate","communicate","coordinate","support"]}
  ]}
},

{
  id:"graphic", name:"Graphic Designer", icon:"🎨", color:"#E24A8D",
  intro:"Turning ideas into images that communicate clearly and beautifully.",
  reading:[
    "A Graphic Designer turns ideas into images that communicate a message clearly and attractively. Every project begins with a **client brief**, a document that explains what the customer wants, who the audience is, and what the final design should achieve.",
    "From there, the designer starts experimenting with **composition**, arranging shapes, images and text so the eye moves naturally across the page. Choosing the right **typography** is essential; a bold, modern font suits a tech start-up, while an elegant serif might suit a law firm.",
    "Colour is just as important as text, so designers select a **palette** of shades that work well together and match the mood of the brand. Many projects also require original **illustration**, whether that means a simple icon or a detailed digital drawing.",
    "Before any design is finalised, the designer creates a **mockup**, a realistic preview that shows how the finished product, such as a poster or app screen, will actually look. Good **layout** is what ties everything together, guiding the viewer's attention to the most important information first. Finally, strong **branding** ensures that every design, from a business card to a website, feels instantly recognisable and consistent across all platforms."
  ],
  glossary:[
    {t:"client brief",d:"a document explaining what a customer wants from a project"},
    {t:"composition",d:"the way visual elements are arranged on a page"},
    {t:"typography",d:"the style and appearance of the text used in a design"},
    {t:"palette",d:"a set of colours chosen to work together"},
    {t:"illustration",d:"an original drawing or image created for a design"},

/* =========================================================
   STATE / HELPERS
   ========================================================= */
const RUNTIME = {};
let CURRENT = null;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function scramble(word){
  let letters = word.split('');
  let out;
  do{ out = shuffle(letters); } while(out.join('') === word && word.length > 1);
  return out;
}
function feedbackTier(score,total){
  const pct = total ? score/total : 0;
  if(pct === 1) return {cls:"good", msg:"Perfect score! Excellent work."};
  if(pct >= 0.75) return {cls:"good", msg:"Great job — you know this vocabulary well."};
  if(pct >= 0.5) return {cls:"mid", msg:"Good effort. Look again at the words you missed."};
  return {cls:"low", msg:"Keep practising — reread the text and try again."};
}
function getProf(id){ return PROFESSIONS.find(p=>p.id===id); }
function totalPoints(){ return 6+5+5+4+4; }

function initRuntime(p){
  if(RUNTIME[p.id]) return RUNTIME[p.id];
  RUNTIME[p.id] = {
    step:1,
    results:{matching:null,dropdown:null,fillword:null,anagram:null,connections:null},
    matching:null, dropdown:null, fillword:null, anagram:null, connections:null
  };
  return RUNTIME[p.id];
}

function openProfession(id){

}

/* =========================================================
   READ ALOUD (text-to-speech)
   ========================================================= */
function getReadingPlainText(p){
  return p.reading.map(par=>par.replace(/\*\*(.+?)\*\*/g,'$1')).join(' ');
}
function toggleReadAloud(){
  if(!('speechSynthesis' in window)){
    alert("Sorry, this browser doesn't support reading text aloud.");
    return;
  }
  const synth = window.speechSynthesis;
  if(synth.speaking){
    synth.cancel();
    syncAudioBtn();
    return;
  }
  const p = getProf(CURRENT);
  if(!p) return;
  const utter = new SpeechSynthesisUtterance(getReadingPlainText(p));
  utter.lang = "en-US";
  utter.rate = 0.95;
  utter.onend = syncAudioBtn;
  utter.onerror = syncAudioBtn;
  synth.speak(utter);
  syncAudioBtn();
}
function stopReadAloud(){
  if('speechSynthesis' in window && window.speechSynthesis.speaking){
    window.speechSynthesis.cancel();
  }
}
function syncAudioBtn(){
  const btn = document.getElementById('audio-btn');
  if(!btn) return;
  const playing = 'speechSynthesis' in window && window.speechSynthesis.speaking;
  btn.classList.toggle('playing', playing);
  btn.querySelector('.icon').textContent = playing ? "⏹️" : "🔊";
  btn.querySelector('.lbl').textContent = playing ? "Stop reading" : "Listen to this text";
}

function escapeAttr(s){
  return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
}
function boldify(text, glossary){
  return text.replace(/\*\*(.+?)\*\*/g, (m, word)=>{
    const g = glossary.find(x=>x.t.toLowerCase()===word.toLowerCase());
    const def = g ? g.d : "";
    return `<button type="button" class="term-btn" data-term="${escapeAttr(word)}" data-def="${escapeAttr(def)}">${word}</button>`;
  });
}

function renderProfession(){
  const p = getProf(CURRENT);
  const rt = initRuntime(p);

  const paragraphs = p.reading.map(par=>`<p>${boldify(par, p.glossary)}</p>`).join('');
  const glossary = p.glossary.map(g=>`<dt>${g.t}</dt><dd>${g.d}</dd>`).join('');

  const stepMeta = [
    {n:1,key:"matching",label:"Matching",total:6},
    {n:2,key:"dropdown",label:"Multiple choice",total:5},
    {n:3,key:"fillword",label:"Word bank",total:5},
    {n:4,key:"anagram",label:"Word puzzle",total:4},
    {n:5,key:"connections",label:"Connections",total:4}
  ];
  const steps = stepMeta.map(sm=>{
    const done = rt.results[sm.key] !== null;
    const cls = "step-btn" + (rt.step===sm.n ? " active" : "") + (done ? " done" : "");
    const scoreTag = done ? `<span class="score-tag">${rt.results[sm.key]}/${sm.total} ✓</span>` : `<span style="font-size:12px;color:var(--text-mute);">not started</span>`;
    return `<button class="${cls}" onclick="goStep(${sm.n})">
      <span class="num">${done ? "✓" : sm.n}</span>
      <span class="label">${sm.label}</span>
      ${scoreTag}
    </button>`;
  }).join('');

  let activityHtml = "";
  if(rt.step===1) activityHtml = renderMatching(p, rt);
  if(rt.step===2) activityHtml = renderDropdown(p, rt);
  if(rt.step===3) activityHtml = renderFillword(p, rt);
  if(rt.step===4) activityHtml = renderAnagram(p, rt);
  if(rt.step===5) activityHtml = renderConnections(p, rt);

  const allDone = stepMeta.every(sm=>rt.results[sm.key] !== null);
  const resultsHtml = allDone ? renderResults(p, rt, stepMeta) : "";

  return `
    <button class="back-btn" onclick="goHome()">← All professions</button>

    <div class="activity-panel" style="--accent:${p.color}">${activityHtml}</div>

function goStep(n){
  const rt = RUNTIME[CURRENT];
  rt.step = n;
  render();
}

/* =========================================================
   ACTIVITY 1 — MATCHING
   ========================================================= */
function renderMatching(p, rt){
  if(!rt.matching){
    const pairs = p.matching.map((m,i)=>({pair:i, term:m.t, def:m.d}));
    rt.matching = {
      terms: shuffle(pairs.map((x,i)=>({...x, idx:i}))),
      defs: shuffle(pairs.map((x,i)=>({...x, idx:i}))),
      selectedTerm:null,
      solved:new Set(),
      mistakes:0,
      total:pairs.length
    };
  }
  const m = rt.matching;
  const done = rt.results.matching !== null;

  const termsHtml = m.terms.map(item=>{
    let cls = "match-item";
    if(m.solved.has(item.pair)) cls += " solved disabled";
    else if(m.selectedTerm===item.pair) cls += " selected";
    return `<button class="${cls}" onclick="matchTermClick(${item.pair})" ${m.solved.has(item.pair)?"disabled":""}>${item.term}</button>`;
  }).join('');
  const defsHtml = m.defs.map(item=>{
    let cls = "match-item";
    if(m.solved.has(item.pair)) cls += " solved disabled";
    return `<button class="${cls}" onclick="matchDefClick(${item.pair})" id="def-${item.pair}" ${m.solved.has(item.pair)?"disabled":""}>${item.def}</button>`;
  }).join('');

  const fb = done ? feedbackTier(rt.results.matching, m.total) : null;

  return `
    <h3>1 · Match the word to its meaning</h3>
    <p class="instructions">Click a word on the left, then click its correct meaning on the right.</p>
    <div class="match-grid">
      <div class="match-col"><h4>Words</h4>${termsHtml}</div>
      <div class="match-col"><h4>Meanings</h4>${defsHtml}</div>
    </div>
    <div class="btn-row">
      ${done ? `<button class="btn secondary" onclick="resetMatching()">Try again</button><span style="font-weight:600;">${rt.results.matching}/${m.total} pairs correct</span>` : `<span style="color:var(--text-mute);font-size:13.5px;">${m.solved.size}/${m.total} matched · ${m.mistakes} mistake(s)</span>`}
    </div>
    ${fb ? `<div class="feedback show ${fb.cls}">${fb.msg}</div>` : ""}
  `;
}
function refreshActivity(){
  const p = getProf(CURRENT);
  const rt = RUNTIME[CURRENT];
  const panel = document.querySelector('.activity-panel');
  if(rt.step===1) panel.innerHTML = renderMatching(p, rt);
  if(rt.step===2) panel.innerHTML = renderDropdown(p, rt);
  if(rt.step===3) panel.innerHTML = renderFillword(p, rt);
  if(rt.step===4) panel.innerHTML = renderAnagram(p, rt);
  if(rt.step===5) panel.innerHTML = renderConnections(p, rt);
  refreshSteps();
  maybeRenderResults();
}

    {key:"connections",total:4,label:"Connections"}
  ];
  const allDone = stepMeta.every(sm=>rt.results[sm.key] !== null);
  let box = document.getElementById('results-box');
  if(allDone){
    const html = renderResults(p, rt, stepMeta);
    if(box){ box.outerHTML = html; }
    else {
      const panel = document.querySelector('.activity-panel');
      panel.insertAdjacentHTML('afterend', html);
    }
  } else if(box){
    box.remove();
  }
}

function matchTermClick(pairIdx){
  const rt = RUNTIME[CURRENT];
  const m = rt.matching;
  if(m.solved.has(pairIdx)) return;
  m.selectedTerm = (m.selectedTerm===pairIdx) ? null : pairIdx;
  refreshActivity();
}
function matchDefClick(pairIdx){
  const rt = RUNTIME[CURRENT];
  const m = rt.matching;
  if(m.solved.has(pairIdx) || m.selectedTerm===null) return;
  if(m.selectedTerm === pairIdx){
    m.solved.add(pairIdx);
    m.selectedTerm = null;
    if(m.solved.size === m.total){
      rt.results.matching = Math.max(0, m.total - m.mistakes);
    }
    refreshActivity();
  } else {
    m.mistakes++;
    const el = document.getElementById('def-'+pairIdx);
    if(el){
      el.classList.add('wrong');
      setTimeout(()=>{ el.classList.remove('wrong'); },500);
    }
    m.selectedTerm = null;
    refreshActivity();
  }
}
function resetMatching(){
  const rt = RUNTIME[CURRENT];
  rt.matching = null;
  rt.results.matching = null;
  refreshActivity();
}

/* =========================================================
   ACTIVITY 2 — DROPDOWN CLOZE
   ========================================================= */
function renderDropdown(p, rt){
  if(!rt.dropdown){
    rt.dropdown = {
      answers: p.dropdown.map(()=>""),
      checked:false
    };
  }
  const d = rt.dropdown;
  const done = rt.results.dropdown !== null;

  const lines = p.dropdown.map((item,i)=>{
    const parts = item.s.split('___');
    const opts = shuffle(item.o);
    const optHtml = `<option value="">choose…</option>` + opts.map(o=>`<option value="${o}" ${d.answers[i]===o?"selected":""}>${o}</option>`).join('');
    let selCls = "blank-select";
    if(d.checked){ selCls += d.answers[i]===item.a ? " correct" : " incorrect"; }
    return `<div class="cloze-line">${i+1}. ${parts[0]}<select class="${selCls}" onchange="dropdownChange(${i}, this.value)" ${d.checked?"disabled":""}>${optHtml}</select>${parts[1]||""}</div>`;
  }).join('');

  const fb = done ? feedbackTier(rt.results.dropdown, p.dropdown.length) : null;

  return `
    <h3>2 · Choose the right word</h3>
    <p class="instructions">Read each sentence and pick the word that fits in the gap.</p>
    ${lines}
    <div class="btn-row">
      ${done
        ? `<button class="btn secondary" onclick="resetDropdown()">Try again</button><span style="font-weight:600;">${rt.results.dropdown}/${p.dropdown.length} correct</span>`
        : `<button class="btn" onclick="checkDropdown()">Check answers</button>`}
    </div>
    ${fb ? `<div class="feedback show ${fb.cls}">${fb.msg}</div>` : ""}
  `;
}
function dropdownChange(i,val){
  const rt = RUNTIME[CURRENT];
  rt.dropdown.answers[i] = val;
}
function checkDropdown(){
  const p = getProf(CURRENT);
  const rt = RUNTIME[CURRENT];
  const d = rt.dropdown;
  d.checked = true;
  let score = 0;
  p.dropdown.forEach((item,i)=>{ if(d.answers[i]===item.a) score++; });
  rt.results.dropdown = score;
  refreshActivity();
}
function resetDropdown(){
  const rt = RUNTIME[CURRENT];
  rt.dropdown = null;
  rt.results.dropdown = null;
  refreshActivity();
}

/* =========================================================
   ACTIVITY 3 — FILL-IN WORD BANK
   ========================================================= */
function renderFillword(p, rt){
  if(!rt.fillword){
    rt.fillword = {
      bank: shuffle(p.fillword.bank).map(w=>({word:w, used:false})),
      blanks: p.fillword.blanks.map(()=>null),
      checked:false
    };
  }
  const f = rt.fillword;
  const done = rt.results.fillword !== null;

  const bankHtml = f.bank.map((b,i)=>`<button class="bank-chip" ${b.used||done?"disabled":""} onclick="bankClick(${i})">${b.word}</button>`).join('');

  const linesHtml = p.fillword.blanks.map((item,i)=>{
    const parts = item.s.split('___');
    const filled = f.blanks[i];
    let slotCls = "blank-slot" + (filled===null ? " empty" : "");
    if(f.checked){ slotCls += filled===item.a ? " correct" : " incorrect"; }
    const label = filled===null ? "______" : filled;
    return `<div class="blank-line">${i+1}. ${parts[0]}<button class="${slotCls}" onclick="blankClick(${i})" ${f.checked?"disabled":""}>${label}</button>${parts[1]||""}</div>`;
  }).join('');

  const fb = done ? feedbackTier(rt.results.fillword, p.fillword.blanks.length) : null;
  const allFilled = f.blanks.every(b=>b!==null);

  return `
    <h3>3 · Insert the correct word</h3>
    <p class="instructions">Click a word in the bank to place it in the next empty gap. Click a filled gap to send the word back.</p>
    <div class="word-bank">${bankHtml}</div>
    ${linesHtml}
    <div class="btn-row">
      ${done
        ? `<button class="btn secondary" onclick="resetFillword()">Try again</button><span style="font-weight:600;">${rt.results.fillword}/${p.fillword.blanks.length} correct</span>`
        : `<button class="btn" onclick="checkFillword()" ${allFilled?"":"disabled"}>Check answers</button>`}
    </div>
    ${fb ? `<div class="feedback show ${fb.cls}">${fb.msg}</div>` : ""}
  `;
}
function bankClick(bankIdx){
  const rt = RUNTIME[CURRENT];
  const f = rt.fillword;
  if(f.bank[bankIdx].used) return;
  const nextEmpty = f.blanks.findIndex(b=>b===null);
  if(nextEmpty===-1) return;
  f.blanks[nextEmpty] = f.bank[bankIdx].word;
  f.bank[bankIdx].used = true;
  f.bank[bankIdx].slot = nextEmpty;
  refreshActivity();
}
function blankClick(blankIdx){
  const rt = RUNTIME[CURRENT];
  const f = rt.fillword;
  if(f.blanks[blankIdx]===null) return;
  const bankItem = f.bank.find(b=>b.used && b.slot===blankIdx);
  if(bankItem){ bankItem.used=false; bankItem.slot=undefined; }
  f.blanks[blankIdx] = null;
  refreshActivity();
}
function checkFillword(){
  const p = getProf(CURRENT);
  const rt = RUNTIME[CURRENT];
  const f = rt.fillword;
  f.checked = true;
  let score = 0;
  p.fillword.blanks.forEach((item,i)=>{ if(f.blanks[i]===item.a) score++; });
  rt.results.fillword = score;
  refreshActivity();
}
function resetFillword(){
  const rt = RUNTIME[CURRENT];
  rt.fillword = null;
  rt.results.fillword = null;
  refreshActivity();
}

/* =========================================================
   ACTIVITY 4 — ANAGRAM (rearrange the letters)
   ========================================================= */
function renderAnagram(p, rt){
  if(!rt.anagram){
    rt.anagram = p.anagram.map(item=>{
      const scrambled = scramble(item.word);
      return {
        word:item.word, clue:item.clue,
        tiles: scrambled.map(ch=>({ch, used:false})),
        slots: new Array(item.word.length).fill(null),
        checked:false
      };
    });
  }
  const a = rt.anagram;
  const done = rt.results.anagram !== null;

  const wordsHtml = a.map((w,wi)=>{
    const tiles = w.tiles.map((t,ti)=>`<button class="tile" ${t.used||w.checked?"disabled":""} onclick="tileClick(${wi},${ti})">${t.used?"":t.ch}</button>`).join('');
    const slots = w.slots.map((s,si)=>{
      let cls = "slot" + (s!==null?" filled":"");
      if(w.checked){ cls += (w.slots.join('')===w.word) ? " correct" : " incorrect"; }
      const ch = s!==null ? w.tiles[s].ch : "";
      return `<button class="${cls}" onclick="slotClick(${wi},${si})" ${w.checked?"disabled":""}>${ch}</button>`;
    }).join('');
    return `<div class="anagram-word">
      <div class="anagram-clue">Clue ${wi+1}: ${w.clue}</div>
      <div class="slot-row">${slots}</div>
      <div class="tile-row">${tiles}</div>
    </div>`;
  }).join('');

  const fb = done ? feedbackTier(rt.results.anagram, a.length) : null;
  const allFilled = a.every(w=>w.slots.every(s=>s!==null));

  return `
    <h3>4 · Rearrange the letters</h3>
    <p class="instructions">Click the letter tiles in order to build each word. Click a filled box to undo it.</p>
    ${wordsHtml}
    <div class="btn-row">
      ${done
        ? `<button class="btn secondary" onclick="resetAnagram()">Try again</button><span style="font-weight:600;">${rt.results.anagram}/${a.length} correct</span>`
        : `<button class="btn" onclick="checkAnagram()" ${allFilled?"":"disabled"}>Check words</button>`}
    </div>
    ${fb ? `<div class="feedback show ${fb.cls}">${fb.msg}</div>` : ""}
  `;
}
function tileClick(wi,ti){
  const rt = RUNTIME[CURRENT];
  const w = rt.anagram[wi];
  if(w.tiles[ti].used) return;
  const nextEmpty = w.slots.findIndex(s=>s===null);
  if(nextEmpty===-1) return;
  w.slots[nextEmpty] = ti;
  w.tiles[ti].used = true;
  refreshActivity();
}
function slotClick(wi,si){
  const rt = RUNTIME[CURRENT];
  const w = rt.anagram[wi];
  if(w.slots[si]===null) return;
  const tileIdx = w.slots[si];
  w.tiles[tileIdx].used = false;
  w.slots[si] = null;
  refreshActivity();
}
function checkAnagram(){
  const rt = RUNTIME[CURRENT];
  let score = 0;
  rt.anagram.forEach(w=>{
    w.checked = true;
    const built = w.slots.map(s=>w.tiles[s].ch).join('');
    if(built === w.word) score++;
  });
  rt.results.anagram = score;
  refreshActivity();
}
function resetAnagram(){
  const rt = RUNTIME[CURRENT];
  rt.anagram = null;
  rt.results.anagram = null;
  refreshActivity();
}

/* =========================================================
   ACTIVITY 5 — CONNECTIONS
   ========================================================= */
function renderConnections(p, rt){
  if(!rt.connections){
    const colors = ["#3E6FF2","#2FAE6D","#D97A25","#7A5CF0"];
    let tiles = [];
    p.connections.groups.forEach((g,gi)=>{
      g.words.forEach(w=> tiles.push({word:w, group:gi}));
    });
    rt.connections = {
      tiles: shuffle(tiles),
      selected: [],
      solvedGroups: [],
      mistakes: 0,
      colors
    };
  }
  const c = rt.connections;
  const done = rt.results.connections !== null;

  const solvedRows = c.solvedGroups.map(gi=>{
    const g = p.connections.groups[gi];
    return `<div class="conn-solved-row" style="background:${c.colors[gi]}"><b>${g.name}</b>${g.words.join(' · ')}</div>`;
  }).join('');

  const tilesHtml = c.tiles.filter(t=>!c.solvedGroups.includes(t.group)).map((t)=>{
    const idx = c.tiles.indexOf(t);
    let cls = "conn-tile";
    if(c.selected.includes(idx)) cls += " selected";
    return `<button class="${cls}" id="conn-${idx}" onclick="connTileClick(${idx})">${t.word}</button>`;
  }).join('');

  const allSolved = c.solvedGroups.length === p.connections.groups.length;
  const fb = done ? feedbackTier(rt.results.connections, 4) : null;

  return `
    <h3>5 · Connections</h3>
    <p class="conn-instructions">Find groups of four related words. Select four tiles, then submit your guess.</p>
    <div class="conn-groups-solved">${solvedRows}</div>
    ${!allSolved ? `<div class="conn-grid">${tilesHtml}</div>` : ""}
    <div class="conn-meta">${allSolved ? "All groups found!" : `${c.selected.length}/4 selected`} · ${c.mistakes} mistake(s)</div>
    <div class="btn-row">
      ${allSolved
        ? (done
            ? `<button class="btn secondary" onclick="resetConnections()">Try again</button><span style="font-weight:600;">${rt.results.connections}/4</span>`
            : `<button class="btn" onclick="finishConnections()">Finish</button>`)
        : `<button class="btn" onclick="submitGroup()" ${c.selected.length===4?"":"disabled"}>Submit group</button>`}
    </div>
    ${fb ? `<div class="feedback show ${fb.cls}">${fb.msg}</div>` : ""}
  `;
}
function connTileClick(idx){
  const rt = RUNTIME[CURRENT];
  const c = rt.connections;
  const pos = c.selected.indexOf(idx);
  if(pos>-1){ c.selected.splice(pos,1); }
  else if(c.selected.length<4){ c.selected.push(idx); }
  refreshActivity();
}
function submitGroup(){
  const rt = RUNTIME[CURRENT];
  const c = rt.connections;
  const groups = c.selected.map(i=>c.tiles[i].group);
  const allSame = groups.every(g=>g===groups[0]);
  if(allSame){
    c.solvedGroups.push(groups[0]);
    c.selected = [];
    refreshActivity();
  } else {
    c.mistakes++;
    c.selected.forEach(i=>{
      const el = document.getElementById('conn-'+i);
      if(el) el.classList.add('shake');
    });
    setTimeout(()=>{
      c.selected = [];
      refreshActivity();
    }, 350);
  }
}
function finishConnections(){
  const rt = RUNTIME[CURRENT];
  const c = rt.connections;
  rt.results.connections = Math.max(0, 4 - c.mistakes);
  refreshActivity();
}
function resetConnections(){
  const rt = RUNTIME[CURRENT];
  rt.connections = null;
  rt.results.connections = null;
  refreshActivity();
}

/* =========================================================
   RESULTS
   ========================================================= */
function renderResults(p, rt, stepMeta){
  const total = stepMeta.reduce((s,m)=>s+m.total,0);
  const score = stepMeta.reduce((s,m)=>s+rt.results[m.key],0);
  const pct = Math.round((score/total)*100);
  const tier = feedbackTier(score,total);
  const rows = stepMeta.map(m=>`<tr><td>${m.label}</td><td>${rt.results[m.key]} / ${m.total}</td></tr>`).join('');
  return `
    <div class="results-banner" id="results-box">
      <h3>Your results — ${p.name}</h3>
      <div class="big-score">${score} / ${total} <span style="font-size:18px;color:#C9CFDA;">(${pct}%)</span></div>
      <div style="font-size:15px;color:#E6E9EF;">${tier.msg}</div>
      <table class="results-table">${rows}</table>
    </div>
  `;
}

/* =========================================================
   MAIN RENDER
   ========================================================= */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = CURRENT ? renderProfession() : renderHome();
  if(CURRENT){
    const html = document.documentElement;
    html.style.setProperty('--current-accent', getProf(CURRENT).color);
    syncAudioBtn();
  }
}

/* =========================================================
   CLICKABLE VOCABULARY TOOLTIPS
   ========================================================= */
let activeTermBtn = null;

function positionTip(btn){
  const tip = document.getElementById('term-tip');
  const rect = btn.getBoundingClientRect();
  tip.style.left = "0px";
  tip.style.top = "0px";
  const tipW = tip.offsetWidth, tipH = tip.offsetHeight;
  let left = rect.left + rect.width/2 - tipW/2;
  left = Math.max(10, Math.min(left, window.innerWidth - tipW - 10));
  let top = rect.bottom + 10;
  if(top + tipH > window.innerHeight - 10){
    top = rect.top - tipH - 10;
  }
  tip.style.left = left + "px";
  tip.style.top = top + "px";
}
function showTermTip(btn){
  const tip = document.getElementById('term-tip');
  tip.innerHTML = `<b>${btn.dataset.term}</b>${btn.dataset.def}`;
  tip.classList.add('show');
  if(activeTermBtn) activeTermBtn.classList.remove('active');
  activeTermBtn = btn;
  btn.classList.add('active');
  positionTip(btn);
}
function hideTermTip(){
  const tip = document.getElementById('term-tip');
  tip.classList.remove('show');
  if(activeTermBtn) activeTermBtn.classList.remove('active');
  activeTermBtn = null;
}
document.addEventListener('click', function(e){
  const btn = e.target.closest('.term-btn');
  if(btn){
    if(activeTermBtn === btn){ hideTermTip(); }
    else { showTermTip(btn); }
    e.stopPropagation();
  } else if(!e.target.closest('.term-tip')){
    hideTermTip();
  }
});
window.addEventListener('scroll', hideTermTip, true);
window.addEventListener('resize', hideTermTip);

render();
</script>
